<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#7D27FC">
  <title>Abrindo sua mesa…</title>
  <style>
    :root { --bg: #F4F2F9; --ink: #160E33; --muted: #625A80; --cobalt: #7D27FC; --surface: #fff; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0C0820; --ink: #EFECFA; --muted: #A298C6; --surface: #161034; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    main { display: grid; justify-items: center; gap: 14px; max-width: 360px; }
    .dot { width: 44px; height: 44px; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--cobalt) 25%, transparent); border-top-color: var(--cobalt); animation: gira .8s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 0; color: var(--muted); }
    code { font: 600 15px ui-monospace, 'SF Mono', Consolas, monospace; letter-spacing: .12em; padding: 4px 10px; border-radius: 8px; background: var(--surface); }
    button { font: inherit; font-weight: 600; min-height: 46px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--cobalt); color: #fff; cursor: pointer; }
    button[disabled] { opacity: .5; }
    .link { background: none; color: var(--cobalt); min-height: 40px; padding: 0 8px; }
    @media (prefers-color-scheme: dark) { .link { color: #BB97FF; } }
    form { display: grid; gap: 10px; width: 100%; }
    input { font: 600 20px ui-monospace, 'SF Mono', Consolas, monospace; letter-spacing: .18em; text-align: center; text-transform: uppercase;
      width: 100%; min-height: 52px; padding: 10px 12px; border-radius: 14px; border: 1.5px solid color-mix(in srgb, var(--muted) 40%, transparent); background: var(--surface); color: var(--ink); }
    input:focus { outline: none; border-color: var(--cobalt); }
    .campo { display: flex; align-items: center; gap: 4px; width: 100%; }
    .campo input { flex: 1 1 0; width: 0; min-width: 0; }
    input.slug { font: 600 18px system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: 0; text-transform: none; text-align: left; }
    .base { flex: none; font-size: 14px; color: var(--muted); }
    .erro { color: #CF3E27; font-weight: 600; min-height: 1.4em; }
    .ico { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--cobalt) 14%, transparent); color: var(--cobalt); font-size: 26px; }
    [hidden] { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
  <script src="/env.js"></script>
  <script>window.CENTRAL_ENV = window.CENTRAL_ENV || window.NFC_ENV || {};</script>
</head>
<body>
  <main id="box" aria-live="polite">
    <div class="dot" aria-hidden="true"></div>
    <h1>Abrindo sua mesa…</h1>
  </main>
  <script>
    // Redirecionador das plaquinhas: /t/CODIGO → site do restaurante dono da plaquinha (?tag=CODIGO).
    // Plaquinha nova (sem dono): a equipe informa o restaurante e escolhe a mesa no painel (PIN).
    (function () {
      var env = window.CENTRAL_ENV || {};
      var bruto = (location.pathname.match(/\/t\/([A-Za-z0-9-]+)/) || [])[1] || new URLSearchParams(location.search).get('c') || '';
      var codigo = bruto.toUpperCase().replace(/[^A-Z0-9]/g, '');
      var box = document.getElementById('box');

      function mostrar(titulo, texto, tentar) {
        box.innerHTML = '<h1></h1><p></p>' + (codigo ? '<code></code>' : '') + (tentar ? '<button type="button">Tentar de novo</button>' : '');
        box.querySelector('h1').textContent = titulo;
        box.querySelector('p').textContent = texto;
        if (codigo) box.querySelector('code').textContent = codigo;
        if (tentar) box.querySelector('button').onclick = function () { location.reload(); };
      }

      var temServidor = !!(env.SUPABASE_URL && env.SUPABASE_ANON_KEY);
      function rpc(fn, args) {
        return fetch(env.SUPABASE_URL + '/rest/v1/rpc/' + fn, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: env.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + env.SUPABASE_ANON_KEY },
          body: JSON.stringify(args),
        }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        });
      }

      // Modo demonstração: dados da central guardados neste navegador.
      function lerDemo() { try { return JSON.parse(localStorage.getItem('central-demo-v1')) || {}; } catch (e) { return {}; } }
      function gravarDemo(db) { try { localStorage.setItem('central-demo-v1', JSON.stringify(db)); } catch (e) {} }

      function consultar() {
        if (temServidor) return rpc('resolver_etiqueta', { p_codigo: codigo });
        var db = lerDemo();
        var e = (db.etiquetas || []).find(function (x) { return x.codigo === codigo; });
        if (!e) return Promise.resolve({ status: 'inexistente' });
        var dia = new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' });
        e.leituras = (e.leituras || 0) + 1;
        e.ultima_leitura = new Date().toISOString();
        db.leituras = db.leituras || [];
        var l = db.leituras.find(function (x) { return x.dia === dia && x.codigo === codigo; });
        if (l) { l.n++; l.restaurante_id = e.restaurante_id; } else db.leituras.push({ dia: dia, codigo: codigo, restaurante_id: e.restaurante_id, n: 1 });
        gravarDemo(db);
        if (!e.restaurante_id) return Promise.resolve({ status: 'livre' });
        var r = (db.restaurantes || []).find(function (x) { return x.id === e.restaurante_id; });
        return Promise.resolve(r && r.ativo !== false ? { status: 'ok', slug: r.slug } : { status: 'inativo' });
      }

      /* Plaquinha nova: a equipe diz de qual restaurante ela é (o endereço, uma
         vez por celular) e entra com o PIN no painel, onde escolhe a mesa. O
         login da equipe é a autorização: não existe código de ativação à parte. */
      var LEMBRAR = 'central-restaurante';
      function lembrado() { try { return JSON.parse(localStorage.getItem(LEMBRAR)); } catch (e) { return null; } }
      function lembrar(v) {
        try {
          v ? localStorage.setItem(LEMBRAR, JSON.stringify(v)) : localStorage.removeItem(LEMBRAR);
          localStorage.removeItem('central-ativacao');
        } catch (e) {}
      }

      // Endereço do restaurante: subdomínio do domínio base. Sem domínio base
      // (teste local), o mesmo servidor com ?r=.
      var BASE = String(env.BASE_DOMAIN || '').toLowerCase();
      function site(slug, caminho, params) {
        var u = BASE ? new URL('https://' + slug + '.' + BASE + caminho) : new URL(caminho, location.origin);
        if (!BASE) u.searchParams.set('r', slug);
        Object.keys(params).forEach(function (k) { u.searchParams.set(k, params[k]); });
        return u.href;
      }

      // "ciencia", "ciencia.vortexsystems.tech" ou o link inteiro do site/painel → "ciencia".
      function slugDe(texto) {
        var t = String(texto || '').trim().toLowerCase().replace(/^https?:\/\//, '').split(/[\/?#\s]/)[0];
        if (BASE && t.slice(-(BASE.length + 1)) === '.' + BASE) t = t.slice(0, -(BASE.length + 1));
        t = t.split('.')[0];
        return /^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$/.test(t) ? t : '';
      }
      function buscarRestaurante(slug) {
        if (temServidor) return rpc('restaurante_publico', { p_slug: slug });
        var r = (lerDemo().restaurantes || []).find(function (x) { return x.slug === slug && x.ativo !== false; });
        return Promise.resolve(r ? { slug: r.slug, nome: r.nome } : null);
      }

      function irParaMesa(slug) {
        // Abre o painel do restaurante já na escolha da mesa desta plaquinha.
        box.innerHTML = '<div class="dot" aria-hidden="true"></div><h1>Abrindo o painel…</h1><p>Entre com o seu PIN e escolha a mesa.</p>';
        location.replace(site(slug, '/admin/', { vincular: codigo }));
      }

      function telaAtivar(msg) {
        var salvo = lembrado();
        if (salvo && salvo.slug && !msg) {
          box.innerHTML = '<div class="ico" aria-hidden="true">✓</div><h1>Plaquinha nova</h1>' +
            '<p>Ligar esta plaquinha a uma mesa de <b id="nomeR"></b>?</p><code></code>' +
            '<button type="button" id="ok">Escolher a mesa</button>' +
            '<button type="button" class="link" id="outro">É de outro restaurante</button>' +
            '<p style="font-size:13px">Cliente? Esta mesa ainda está sendo preparada. Chame o garçom.</p>';
          box.querySelector('#nomeR').textContent = salvo.nome || salvo.slug;
          box.querySelector('code').textContent = codigo;
          box.querySelector('#ok').onclick = function () { irParaMesa(salvo.slug); };
          box.querySelector('#outro').onclick = function () { lembrar(null); telaAtivar(); };
          return;
        }
        box.innerHTML = '<div class="ico" aria-hidden="true">＋</div><h1>Plaquinha nova</h1>' +
          '<p>Se você é da equipe, digite o <b>endereço do restaurante</b>. Depois é só entrar com o seu PIN e escolher a mesa.</p><code></code>' +
          '<form id="f" novalidate><label for="rest" class="sr">Endereço do restaurante</label>' +
          '<div class="campo"><input id="rest" class="slug" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="80" placeholder="restaurante" inputmode="url">' +
          (BASE ? '<span class="base"></span>' : '') + '</div>' +
          '<button type="submit">Continuar</button><p class="erro" id="erro" role="alert"></p></form>' +
          '<p style="font-size:13px">Cliente? Esta mesa ainda está sendo preparada. Chame o garçom.</p>';
        box.querySelector('code').textContent = codigo;
        if (BASE) box.querySelector('.base').textContent = '.' + BASE;
        var inp = box.querySelector('#rest');
        var erro = box.querySelector('#erro');
        erro.textContent = msg || '';
        box.querySelector('#f').onsubmit = function (ev) {
          ev.preventDefault();
          var slug = slugDe(inp.value);
          var btn = this.querySelector('button');
          if (!slug) { erro.textContent = 'Digite o endereço do restaurante (o nome antes de .' + (BASE || 'seu-dominio') + ').'; return inp.focus(); }
          btn.disabled = true;
          buscarRestaurante(slug).then(function (r) {
            if (!r) { btn.disabled = false; erro.textContent = 'Não achamos esse restaurante. Confira o endereço.'; return inp.focus(); }
            lembrar({ slug: slug, nome: (r.restaurante && r.restaurante.nome) || r.nome || slug });
            irParaMesa(slug);
          }).catch(function () {
            btn.disabled = false;
            erro.textContent = 'Sem conexão. Confira a internet e tente de novo.';
          });
        };
        setTimeout(function () { inp.focus(); }, 50);
      }

      if (!codigo) return mostrar('Link incompleto', 'Encoste o celular na plaquinha de novo ou aponte a câmera para o QR.');
      consultar().then(function (r) {
        if (r && r.status === 'ok' && r.slug) {
          location.replace(site(r.slug, '/', { tag: codigo }));
        } else if (r && r.status === 'livre') {
          telaAtivar();
        } else if (r && r.status === 'inativo') {
          mostrar('Plaquinha desativada', 'O serviço desta plaquinha está desativado. Avise a equipe do restaurante.');
        } else {
          mostrar('Plaquinha não encontrada', 'Não reconhecemos este código. Confira se o link está completo.');
        }
      }).catch(function () {
        mostrar('Sem conexão', 'Não foi possível abrir a página da mesa. Confira a internet.', true);
      });
    })();
  </script>
</body>
</html>
