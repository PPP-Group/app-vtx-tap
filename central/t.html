<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1B3A9E">
  <title>Abrindo sua mesa…</title>
  <style>
    :root { --bg: #F2F4F8; --ink: #0F1430; --muted: #596080; --cobalt: #1B3A9E; --surface: #fff; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #090D20; --ink: #ECEFFA; --muted: #97A0C4; --surface: #111735; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    main { display: grid; justify-items: center; gap: 14px; max-width: 360px; }
    .dot { width: 44px; height: 44px; border-radius: 50%; border: 4px solid color-mix(in srgb, var(--cobalt) 25%, transparent); border-top-color: var(--cobalt); animation: gira .8s linear infinite; }
    @keyframes gira { to { transform: rotate(360deg); } }
    h1 { margin: 0; font-size: 22px; }
    p { margin: 0; color: var(--muted); }
    code { font: 600 15px ui-monospace, 'SF Mono', Consolas, monospace; letter-spacing: .12em; padding: 4px 10px; border-radius: 8px; background: var(--surface); }
    button { font: inherit; font-weight: 600; min-height: 46px; padding: 0 22px; border: 0; border-radius: 999px; background: var(--cobalt); color: #fff; cursor: pointer; }
    button[disabled] { opacity: .5; }
    .link { background: none; color: var(--cobalt); min-height: 40px; padding: 0 8px; }
    @media (prefers-color-scheme: dark) { .link { color: #93A9FF; } }
    form { display: grid; gap: 10px; width: 100%; }
    input { font: 600 20px ui-monospace, 'SF Mono', Consolas, monospace; letter-spacing: .18em; text-align: center; text-transform: uppercase;
      width: 100%; min-height: 52px; padding: 10px 12px; border-radius: 14px; border: 1.5px solid color-mix(in srgb, var(--muted) 40%, transparent); background: var(--surface); color: var(--ink); }
    input:focus { outline: none; border-color: var(--cobalt); }
    .erro { color: #CF3E27; font-weight: 600; min-height: 1.4em; }
    .ico { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--cobalt) 14%, transparent); color: var(--cobalt); font-size: 26px; }
    [hidden] { display: none !important; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
  <script src="/env.js"></script>
</head>
<body>
  <main id="box" aria-live="polite">
    <div class="dot" aria-hidden="true"></div>
    <h1>Abrindo sua mesa…</h1>
  </main>
  <script>
    // Redirecionador das plaquinhas: /t/CODIGO → site do restaurante dono da plaquinha (?tag=CODIGO).
    // Plaquinha nova (sem dono): a equipe ativa com o código de ativação do restaurante.
    (function () {
      var env = window.CENTRAL_ENV || {};
      var bruto = (location.pathname.match(/\/t\/([A-Za-z0-9-]+)/) || [])[1] || new URLSearchParams(location.search).get('c') || '';
      var codigo = bruto.toUpperCase().replace(/[^A-Z0-9]/g, '');
      var box = document.getElementById('box');

      function mostrar(titulo, texto, tentar) {
        box.innerHTML = '<h1></h1><p></p>' + (codigo ? '<code></code>' : '') + (tentar ? '<button type="button">Tentar de novo</button>' : '');
        box.querySelector('h1').textContent = titulo;
        box.querySelector('p').textContent = texto;
        if (codigo) box.querySelector('code').textContent = codigo;
        if (tentar) box.querySelector('button').onclick = function () { location.reload(); };
      }

      var temServidor = !!(env.SUPABASE_URL && env.SUPABASE_ANON_KEY);
      function rpc(fn, args) {
        return fetch(env.SUPABASE_URL + '/rest/v1/rpc/' + fn, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: env.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + env.SUPABASE_ANON_KEY },
          body: JSON.stringify(args),
        }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        });
      }

      // Modo demonstração: dados da central guardados neste navegador.
      function lerDemo() { try { return JSON.parse(localStorage.getItem('central-demo-v1')) || {}; } catch (e) { return {}; } }
      function gravarDemo(db) { try { localStorage.setItem('central-demo-v1', JSON.stringify(db)); } catch (e) {} }

      function consultar() {
        if (temServidor) return rpc('resolver_etiqueta', { p_codigo: codigo });
        var db = lerDemo();
        var e = (db.etiquetas || []).find(function (x) { return x.codigo === codigo; });
        if (!e) return Promise.resolve({ status: 'inexistente' });
        var dia = new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Sao_Paulo' });
        e.leituras = (e.leituras || 0) + 1;
        e.ultima_leitura = new Date().toISOString();
        db.leituras = db.leituras || [];
        var l = db.leituras.find(function (x) { return x.dia === dia && x.codigo === codigo; });
        if (l) { l.n++; l.restaurante_id = e.restaurante_id; } else db.leituras.push({ dia: dia, codigo: codigo, restaurante_id: e.restaurante_id, n: 1 });
        gravarDemo(db);
        if (!e.restaurante_id) return Promise.resolve({ status: 'livre' });
        var r = (db.restaurantes || []).find(function (x) { return x.id === e.restaurante_id; });
        return Promise.resolve(r && r.ativo !== false ? { status: 'ok', destino: r.destino } : { status: 'inativo' });
      }

      // Mesmas regras de public.ativar_etiqueta() do schema.sql.
      function ativar(ativacao) {
        var atv = String(ativacao || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (temServidor) return rpc('ativar_etiqueta', { p_codigo: codigo, p_ativacao: atv });
        var db = lerDemo();
        var e = (db.etiquetas || []).find(function (x) { return x.codigo === codigo; });
        if (!e) return Promise.resolve({ status: 'inexistente' });
        var r = (db.restaurantes || []).find(function (x) { return x.codigo_ativacao === atv && x.ativo !== false; });
        if (!r) return Promise.resolve({ status: 'codigo_incorreto' });
        if (!e.restaurante_id) { e.restaurante_id = r.id; e.vendida_em = new Date().toISOString(); gravarDemo(db); }
        return Promise.resolve({ status: 'ok', destino: r.destino, restaurante: r.nome });
      }

      /* Plaquinha nova: a equipe digita o código de ativação do restaurante.
         O celular guarda o restaurante para ativar as próximas com um toque. */
      var LEMBRAR = 'central-ativacao';
      function lembrado() { try { return JSON.parse(localStorage.getItem(LEMBRAR)); } catch (e) { return null; } }
      function lembrar(v) { try { v ? localStorage.setItem(LEMBRAR, JSON.stringify(v)) : localStorage.removeItem(LEMBRAR); } catch (e) {} }
      function formatar(c) { c = String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); return c.length > 4 ? c.slice(0, 4) + '-' + c.slice(4, 8) : c; }

      function irParaMesa(destino) {
        // Abre o painel do restaurante já na escolha da mesa desta plaquinha.
        location.replace(new URL('admin/?vincular=' + encodeURIComponent(codigo), destino).href);
      }

      function telaAtivar(msg) {
        var salvo = lembrado();
        if (salvo && salvo.codigo && !msg) {
          box.innerHTML = '<div class="ico" aria-hidden="true">✓</div><h1>Plaquinha nova</h1>' +
            '<p>Ativar esta plaquinha para <b id="nomeR"></b>? Depois você escolhe a mesa.</p><code></code>' +
            '<button type="button" id="ok">Ativar e escolher a mesa</button><p class="erro" id="erro" role="alert"></p>' +
            '<button type="button" class="link" id="outro">É de outro restaurante</button>';
          box.querySelector('#nomeR').textContent = salvo.nome || 'o seu restaurante';
          box.querySelector('code').textContent = codigo;
          box.querySelector('#ok').onclick = function () { enviar(salvo.codigo, this); };
          box.querySelector('#outro').onclick = function () { lembrar(null); telaAtivar(); };
          return;
        }
        box.innerHTML = '<div class="ico" aria-hidden="true">＋</div><h1>Plaquinha nova</h1>' +
          '<p>Se você é da equipe do restaurante, digite o <b>código de ativação</b> que recebeu na implantação. Depois é só escolher a mesa.</p><code></code>' +
          '<form id="f" novalidate><label for="atv" class="sr">Código de ativação</label>' +
          '<input id="atv" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="XXXX-XXXX" inputmode="text">' +
          '<button type="submit">Ativar</button><p class="erro" id="erro" role="alert"></p></form>' +
          '<p style="font-size:13px">Cliente? Esta mesa ainda está sendo preparada. Chame o garçom.</p>';
        box.querySelector('code').textContent = codigo;
        var inp = box.querySelector('#atv');
        box.querySelector('#erro').textContent = msg || '';
        inp.oninput = function () { var p = inp.value; inp.value = formatar(p); };
        box.querySelector('#f').onsubmit = function (ev) {
          ev.preventDefault();
          var v = inp.value.replace(/[^A-Za-z0-9]/g, '');
          if (v.length !== 8) { box.querySelector('#erro').textContent = 'O código de ativação tem 8 letras e números.'; return inp.focus(); }
          enviar(v, this.querySelector('button'));
        };
        setTimeout(function () { inp.focus(); }, 50);
      }

      function enviar(ativacao, btn) {
        btn.disabled = true;
        ativar(ativacao).then(function (r) {
          if (r && r.status === 'ok' && r.destino) {
            lembrar({ codigo: String(ativacao).toUpperCase().replace(/[^A-Z0-9]/g, ''), nome: r.restaurante || '' });
            box.innerHTML = '<div class="dot" aria-hidden="true"></div><h1>Plaquinha ativada</h1><p>Abrindo a escolha da mesa…</p>';
            return irParaMesa(r.destino);
          }
          if (r && r.status === 'codigo_incorreto') { lembrar(null); return telaAtivar('Código de ativação incorreto. Confira e tente de novo.'); }
          if (r && r.status === 'bloqueado') return telaAtivar('Muitas tentativas erradas. Aguarde 10 minutos e tente de novo.');
          if (r && r.status === 'inativo') return mostrar('Plaquinha desativada', 'O serviço deste restaurante está desativado. Fale com a Vortex.');
          mostrar('Plaquinha não encontrada', 'Não reconhecemos este código. Confira se o link está completo.');
        }).catch(function () {
          btn.disabled = false;
          var e = box.querySelector('#erro');
          if (e) e.textContent = 'Sem conexão. Confira a internet e tente de novo.';
        });
      }

      if (!codigo) return mostrar('Link incompleto', 'Encoste o celular na plaquinha de novo ou aponte a câmera para o QR.');
      consultar().then(function (r) {
        if (r && r.status === 'ok' && r.destino) {
          var u = new URL(r.destino);
          u.searchParams.set('tag', codigo);
          location.replace(u.href);
        } else if (r && r.status === 'livre') {
          telaAtivar();
        } else if (r && r.status === 'inativo') {
          mostrar('Plaquinha desativada', 'O serviço desta plaquinha está desativado. Avise a equipe do restaurante.');
        } else {
          mostrar('Plaquinha não encontrada', 'Não reconhecemos este código. Confira se o link está completo.');
        }
      }).catch(function () {
        mostrar('Sem conexão', 'Não foi possível abrir a página da mesa. Confira a internet.', true);
      });
    })();
  </script>
</body>
</html>
