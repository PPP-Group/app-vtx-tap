# Cabeçalhos de segurança (incluído em cada location: no nginx, um add_header dentro da location
# apaga os de fora, então todo bloco que tem add_header repete este include).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Câmera para ler QR e nota; localização para o endereço do delivery.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=(self), usb=(), interest-cohort=()" always;
# Só carrega script do próprio site e do jsDelivr (Supabase, leitor de QR, OCR, PDF, planilha); conversa só com
# o Supabase, o ViaCEP e o OpenStreetMap. 'wasm-unsafe-eval' para o leitor de QR e o OCR (WebAssembly).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://viacep.com.br https://nominatim.openstreetmap.org; worker-src 'self' blob: https://cdn.jsdelivr.net; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
