# Regras comuns à central e aos restaurantes.
root /usr/share/nginx/html;
index index.html;

# Cabeçalhos de segurança nas respostas que não têm add_header próprio.
include /etc/nginx/snippets/seguranca.conf;
# Sem versão do nginx nas respostas de erro.
server_tokens off;

# Compressão: HTML, JS, CSS e SVG chegam 3 a 5 vezes menores no celular.
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/plain;

# Redirecionamentos relativos: funciona atrás do proxy do EasyPanel sem vazar a porta interna.
absolute_redirect off;

# /admin serve admin/index.html sem extensão e sem barra obrigatória.
location / {
  try_files $uri $uri/ =404;
}

# Toque na plaquinha / leitura do QR: /t/CODIGO → redirecionador.
location ^~ /t/ {
  try_files /central/t.html =404;
  add_header Cache-Control "no-store";
  include /etc/nginx/snippets/seguranca.conf;
}

# Gerado na subida do container com as variáveis de ambiente: nunca guardar em cache.
location = /env.js {
  add_header Cache-Control "no-store";
  include /etc/nginx/snippets/seguranca.conf;
}

# Service worker e manifesto do app do painel: sempre a versão mais nova.
location = /admin/sw.js {
  add_header Cache-Control "no-cache";
  add_header Service-Worker-Allowed "/admin/";
  include /etc/nginx/snippets/seguranca.conf;
}

# App da central (VTX Master): service worker na raiz para cobrir /master.
location = /master-sw.js {
  default_type application/javascript;
  try_files /central/sw.js =404;
  add_header Cache-Control "no-cache";
  include /etc/nginx/snippets/seguranca.conf;
}

location = /central/manifest.webmanifest {
  default_type application/manifest+json;
  add_header Cache-Control "no-cache";

  include /etc/nginx/snippets/seguranca.conf;

}

location = /admin/manifest.webmanifest {
  default_type application/manifest+json;
  add_header Cache-Control "no-cache";

  include /etc/nginx/snippets/seguranca.conf;

}

# Delivery: service worker dos avisos do pedido e manifesto (no iPhone os avisos só chegam com o site na tela de início).
location = /delivery/sw.js {
  add_header Cache-Control "no-cache";
  add_header Service-Worker-Allowed "/delivery/";
  include /etc/nginx/snippets/seguranca.conf;
}

location = /delivery/manifest.webmanifest {
  default_type application/manifest+json;
  add_header Cache-Control "no-cache";

  include /etc/nginx/snippets/seguranca.conf;

}

# Modelo 3D da plaquinha (realidade aumentada): o nginx não conhece o .glb.
location ~* \.glb$ {
  types { model/gltf-binary glb; }
  add_header Cache-Control "public, max-age=86400";
  add_header Access-Control-Allow-Origin "*";

  include /etc/nginx/snippets/seguranca.conf;

}

location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
  add_header Cache-Control "public, max-age=300";

  include /etc/nginx/snippets/seguranca.conf;

}

location ~* \.html$ {
  add_header Cache-Control "no-cache";

  include /etc/nginx/snippets/seguranca.conf;

}
