<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F2F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C0820" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Peça pelo delivery: escolha no cardápio, informe o endereço e acompanhe o pedido.">
  <title>Delivery</title>
  <link rel="icon" href="/assets/img/icon-64.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/cliente.css">
  <link rel="stylesheet" href="/assets/css/delivery.css">
  <script>
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('nfc-tema') || 'light'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body class="cliente delivery">
  <div class="app">
    <header class="hero">
      <div class="hero-cover" id="heroCover"></div>
      <div class="hero-row">
        <div class="hero-logo" id="heroLogo"></div>
        <div class="hero-id">
          <h1 class="hero-name" id="brandName"></h1>
          <p class="hero-desc" id="brandDesc">Delivery</p>
        </div>
      </div>
      <div class="hero-status">
        <span class="open-pill" id="openPill" hidden></span>
        <span class="dl-info" id="dlInfo"></span>
      </div>
    </header>

    <main id="dlMain" class="dl-main" aria-live="polite"><p class="muted">Carregando o cardápio…</p></main>
  </div>

  <!-- Barra do carrinho -->
  <div class="dl-barra" id="dlBarra" hidden>
    <button type="button" class="btn btn-cobalt btn-block" data-dl="carrinho"><span id="dlBarraQtd"></span><b id="dlBarraTotal"></b></button>
  </div>

  <!-- Folha: carrinho e finalizar -->
  <div class="sheet sheet--full" id="sh-dl" hidden role="dialog" aria-modal="true" aria-labelledby="dlTitle">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" tabindex="-1">
      <div class="sheet-grip"></div>
      <header class="sheet-head"><h2 id="dlTitle">Seu pedido</h2><button class="icon-btn" type="button" data-close aria-label="Fechar"></button></header>
      <div class="sheet-body" id="dlBody"></div>
    </div>
  </div>


  <script src="/env.js" defer></script>
  <script src="/assets/js/config.js" defer></script>
  <script src="/assets/js/precos.js" defer></script>
  <script src="/assets/js/store.js" defer></script>
  <script src="/assets/js/ui.js" defer></script>
  <script src="/assets/js/delivery.js" defer></script>
</body>
</html>
