<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140B33">
  <meta name="robots" content="noindex">
  <title>Painel da equipe</title>
  <link rel="icon" href="../assets/img/icon-64.png" type="image/png">
  <link rel="manifest" href="/admin/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/admin/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="VTX Painel">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="VTX Painel">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <link rel="stylesheet" href="../assets/css/campos.css">
  <script>
    var t = 'light';
    try { t = localStorage.getItem('nfc-tema-painel') || 'light'; } catch (e) {}
    if (t !== 'auto') document.documentElement.dataset.theme = t;
  </script>
</head>
<body class="painel">
  <!-- Entrada -->
  <div class="login" id="login" hidden>
    <div class="login-card">
      <span class="vtx-logo vtx-logo--login"><img class="vtx-escuro" src="../assets/img/vtx-tap-escuro.png" alt="VTX Tap"><img class="vtx-claro" src="../assets/img/vtx-tap.png" alt=""></span>
      <div class="plate login-plate">
        <span class="rivet r1"></span><span class="rivet r2"></span>
        <span class="login-kicker">Painel da equipe</span>
        <strong class="login-name" id="loginBrand"></strong>
      </div>
      <form class="stack" id="loginForm" novalidate></form>
      <span class="vtx-logo endosso"><img class="vtx-escuro" src="../assets/img/marca/endosso-cor.svg" alt="Uma solução Vortex"><img class="vtx-claro" src="../assets/img/marca/endosso-negativo.svg" alt="Uma solução Vortex"></span>
    </div>
  </div>

  <!-- Aplicativo -->
  <div class="shell" id="shell" hidden>
    <aside class="side" aria-label="Menu principal">
      <div class="side-brand">
        <img class="side-sistema" src="../assets/img/vtx-tap.png" alt="VTX Tap">
        <div class="side-rest">
          <span class="side-mark" aria-hidden="true"></span>
          <div><strong id="sideBrand"></strong><small>Painel da equipe</small></div>
        </div>
      </div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>

    <header class="mtop">
      <h1 class="mtop-title" id="mtopTitle"></h1>
      <div class="mtop-actions" id="mtopActions"></div>
    </header>

    <main class="main" id="main" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Menu principal"></nav>
  </div>

  <!-- Detalhe da mesa -->
  <div class="sheet" id="sh-mesa" role="dialog" aria-modal="true" aria-labelledby="mesaTitle" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" tabindex="-1">
      <div class="sheet-grip"></div>
      <header class="sheet-head"><h2 id="mesaTitle">Mesa</h2><button class="icon-btn" type="button" data-close aria-label="Fechar"></button></header>
      <div class="sheet-body" id="mesaBody"></div>
    </div>
  </div>

  <!-- Ligar plaquinha a uma mesa -->
  <div class="sheet" id="sh-vincular" role="dialog" aria-modal="true" aria-labelledby="vincTitle" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" tabindex="-1">
      <div class="sheet-grip"></div>
      <header class="sheet-head"><h2 id="vincTitle">Plaquinha nova</h2><button class="icon-btn" type="button" data-close aria-label="Fechar"></button></header>
      <div class="sheet-body" id="vincBody"></div>
    </div>
  </div>

  <!-- Prato do cardápio -->
  <div class="sheet" id="sh-item" role="dialog" aria-modal="true" aria-labelledby="itemTitle" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" tabindex="-1">
      <div class="sheet-grip"></div>
      <header class="sheet-head"><h2 id="itemTitle">Prato</h2><button class="icon-btn" type="button" data-close aria-label="Fechar"></button></header>
      <div class="sheet-body" id="itemBody"></div>
    </div>
  </div>

  <!-- Fidelidade: cliente, lançar nota -->
  <div class="sheet" id="sh-fp" role="dialog" aria-modal="true" aria-labelledby="fpTitle" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" tabindex="-1">
      <div class="sheet-grip"></div>
      <header class="sheet-head"><h2 id="fpTitle">Cliente</h2><button class="icon-btn" type="button" data-close aria-label="Fechar"></button></header>
      <div class="sheet-body" id="fpBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" defer></script>
  <script src="../env.js" defer></script>
  <script src="../assets/js/config.js" defer></script>
  <script src="../assets/js/precos.js" defer></script>
  <script src="../assets/js/store.js" defer></script>
  <script src="../assets/js/planilha.js" defer></script>
  <script src="../assets/js/ui.js" defer></script>
  <script src="../assets/js/campos.js" defer></script>
  <script src="../assets/js/ocr-nota.js" defer></script>
  <script src="../assets/js/leitor.js" defer></script>
  <script src="../assets/js/nfce.js" defer></script>
  <script src="../assets/js/fid-painel.js" defer></script>
  <script src="../assets/js/delivery-painel.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
